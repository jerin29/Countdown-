<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"name","type":"string","label":"Name","default":"JERIN J SEBASTIAN"},
    {"id":"handle","type":"string","label":"Handle","default":"@jerin_chronicles_"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --gold-1: #fff3c4; --gold-2: #ffc24a; --gold-3: #d4673e; --ink: #0b0606; --teal: #1f7f86; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
      #stage { position: absolute; inset: 0; }
      #glow { position: absolute; inset: -10%; background: radial-gradient(ellipse 60% 40% at 50% 46%, rgba(212,103,62,.55) 0%, rgba(120,30,20,.25) 45%, rgba(0,0,0,0) 75%); opacity: .35; }
      #glow-teal { position: absolute; inset: -10%; background: radial-gradient(ellipse 50% 30% at 50% 70%, rgba(31,127,134,.45) 0%, rgba(0,0,0,0) 70%); opacity: 0; }
      .streak { position: absolute; left: -40%; width: 180%; height: 26px; background: linear-gradient(90deg, rgba(255,194,74,0) 0%, rgba(255,194,74,.9) 50%, rgba(255,194,74,0) 100%); transform-origin: 50% 50%; }
      #streak1 { top: 520px; } #streak2 { top: 980px; height: 10px; } #streak3 { top: 1360px; height: 18px; }
      .word { position: absolute; left: 0; right: 0; top: 700px; text-align: center; opacity: 0; filter: drop-shadow(0 18px 30px rgba(0,0,0,.6)); }
      .strip {
        display: inline-block; padding: 34px 64px 26px; background-color: #f1e3c4; background-image: url(assets/paper.png);
        background-size: 1080px 1920px; background-blend-mode: overlay;
      }
      .strip span { display: inline-block; font: 400 210px/1 "League Gothic", "Oswald", sans-serif; letter-spacing: .04em; color: #1a0e0a; }
      #w2 .strip { background-color: #c4262c; } #w2 .strip span { color: #fff3dc; }
      #handle-tag { padding: 18px 36px 14px; }
      #w3 .strip { background-color: #1f7f86; } #w3 .strip span { color: #ffd27a; font-size: 160px; }
      .rip { position: absolute; inset: 0; background-color: #efe0bf; background-image: url(assets/paper.png); background-size: 1080px 1920px; background-blend-mode: overlay; }
      #rip-wrap { position: absolute; inset: 0; z-index: 20; filter: drop-shadow(0 0 40px rgba(0,0,0,.7)); }
      #rip-mark { position: absolute; left: 0; right: 0; top: 860px; text-align: center; font: 400 120px/1 "League Gothic", "Oswald", sans-serif; letter-spacing: .3em; color: rgba(60,30,20,.18); }
      #paper { position: absolute; inset: 0; background: url(assets/paper.png) center / 1080px 1920px; mix-blend-mode: overlay; opacity: .6; pointer-events: none; }
      #ring { position: absolute; left: 540px; top: 720px; width: 600px; height: 600px; margin: -300px 0 0 -300px; border-radius: 50%; border: 18px solid var(--gold-2); opacity: 0; }
      #ring2 { position: absolute; left: 540px; top: 720px; width: 600px; height: 600px; margin: -300px 0 0 -300px; border-radius: 50%; border: 8px solid var(--teal); opacity: 0; }
      #logo-wrap { position: absolute; left: 220px; top: 400px; width: 640px; height: 640px; opacity: 0; }
      #logo { width: 640px; height: 640px; display: block; }
      #shine { position: absolute; inset: 0; overflow: hidden; -webkit-mask: url(assets/logo-cut.png) center / contain no-repeat; mask: url(assets/logo-cut.png) center / contain no-repeat; }
      #shine-bar { position: absolute; top: -20%; left: -60%; width: 40%; height: 140%; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.75) 50%, rgba(255,255,255,0) 100%); transform: rotate(18deg); }
      #name { position: absolute; left: 0; right: 0; top: 1080px; text-align: center; white-space: nowrap; }
      #name span {
        display: inline-block; font: 400 150px/1 "League Gothic", "Oswald", sans-serif; letter-spacing: .05em;
        background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 50%, var(--gold-3) 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent; opacity: 0;
      }
      #name span.sp { width: 40px; }
      #handle { position: absolute; left: 0; right: 0; top: 1236px; text-align: center; font: 800 50px/1 "Montserrat", sans-serif; color: #1a0e0a; filter: drop-shadow(0 8px 16px rgba(0,0,0,.6)); letter-spacing: .01em; opacity: 0; }
      #tag { position: absolute; left: 0; right: 0; top: 1322px; text-align: center; font: 700 28px/1 "Montserrat", sans-serif; color: var(--gold-2); letter-spacing: .38em; opacity: 0; }
      .ember { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle, #fff3c4 0%, #ffb347 45%, rgba(255,120,40,0) 70%); opacity: 0; }
      #flash { position: absolute; inset: 0; background: #fff6e6; opacity: 0; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.75) 100%); pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.5" data-width="1080" data-height="1920">
      <div id="stage">
        <div id="glow"></div>
        <div id="glow-teal"></div>
        <div id="streaks" class="clip" data-start="0" data-duration="3.0" data-track-index="1">
          <div class="streak" id="streak1"></div><div class="streak" id="streak2"></div><div class="streak" id="streak3"></div>
        </div>
        <div class="word clip" id="w1" data-start="1.0" data-duration="0.5" data-track-index="2"><div class="strip"><span>COOKING</span></div></div>
        <div class="word clip" id="w2" data-start="1.5" data-duration="0.5" data-track-index="2"><div class="strip"><span>TRAVEL</span></div></div>
        <div class="word clip" id="w3" data-start="2.0" data-duration="0.5" data-track-index="2"><div class="strip"><span>EVERYDAY LIFE</span></div></div>
        <div id="rip-wrap" class="clip" data-start="2.3" data-duration="1.1" data-track-index="11"><div class="rip" id="rip-l"></div><div class="rip" id="rip-r"></div><div id="rip-mark">JERIN</div></div>
        <div id="embers" class="clip" data-start="2.4" data-duration="4.1" data-track-index="3"></div>
        <div id="ring" class="clip" data-start="3.0" data-duration="0.8" data-track-index="4"></div>
        <div id="ring2" class="clip" data-start="3.05" data-duration="0.9" data-track-index="5"></div>
        <div id="logo-wrap" class="clip" data-start="2.95" data-duration="3.55" data-track-index="6">
          <img id="logo" src="assets/logo-cut.png" alt="" />
          <div id="shine"><div id="shine-bar"></div></div>
        </div>
        <div id="name" class="clip" data-start="3.45" data-duration="3.05" data-track-index="7" data-var-text="name"></div>
        <div id="handle" class="clip" data-start="4.2" data-duration="2.3" data-track-index="8"><span class="strip" id="handle-tag">@jerin_chronicles_</span></div>
        <div id="tag" class="clip" data-start="4.45" data-duration="2.05" data-track-index="9">COOKING · TRAVEL · LIFE</div>
      </div>
      <div id="vignette" data-layout-ignore></div>
      <div id="paper" data-layout-ignore></div>
      <div id="flash" data-layout-ignore></div>
      <audio id="score" class="clip" src="assets/audio/mass-score.wav" data-start="0" data-duration="6.5" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 6.5 }, 0);
      const stage = "#stage";
      // camera shake on a hit: deterministic offsets that settle
      const shake = (t, amp, n = 6) => {
        const xs = [1, -0.8, 0.6, -0.45, 0.3, -0.15, 0];
        for (let i = 0; i < n; i++) tl.to(stage, { x: xs[i] * amp, y: -xs[(i + 2) % 7] * amp * 0.7, duration: 0.03, ease: "none" }, t + i * 0.03);
        tl.to(stage, { x: 0, y: 0, duration: 0.05, ease: "power1.out" }, t + n * 0.03);
      };
      const flash = (t, peak, d = 0.18) => {
        tl.fromTo("#flash", { opacity: peak }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
      };
      const glowHit = (t, peak) => tl.fromTo("#glow", { opacity: peak }, { opacity: 0.35, duration: 0.45, ease: "power2.out", immediateRender: false }, t);

      // build 0-1.0: light streaks sweep on the taiko hits
      [["#streak1", 0.0, -12], ["#streak2", 0.5, 9], ["#streak3", 0.75, -6], ["#streak1", 0.875, 14], ["#streak2", 0.9375, -10]].forEach(([s, t, r], i) => {
        tl.fromTo(s, { xPercent: i % 2 ? 60 : -60, rotation: r, opacity: 0 }, { xPercent: i % 2 ? -60 : 60, opacity: 1, duration: 0.22, ease: "power2.in", immediateRender: false }, t);
        tl.to(s, { opacity: 0, duration: 0.12, ease: "none" }, t + 0.2);
        glowHit(t, 0.6 + i * 0.08);
      });
      shake(0.0, 10, 4);
      // torn-paper edges (seeded) for every strip and the rip halves
      let tseed = 77; const tr = () => { tseed = (tseed * 16807) % 2147483647; return tseed / 2147483647; };
      const tornStrip = (el) => {
        const pts = []; const n = 22;
        for (let i = 0; i <= n; i++) pts.push(`${(i / n * 100).toFixed(1)}% ${(tr() * 9).toFixed(1)}%`);
        for (let i = n; i >= 0; i--) pts.push(`${(i / n * 100).toFixed(1)}% ${(91 + tr() * 9).toFixed(1)}%`);
        el.style.clipPath = `polygon(${pts.join(",")})`;
      };
      document.querySelectorAll(".strip").forEach(tornStrip);
      const tear = []; for (let i = 0; i <= 40; i++) tear.push([50 + (tr() - 0.5) * 7 + Math.sin(i * 0.9) * 2.5, i / 40 * 100]);
      document.getElementById("rip-l").style.clipPath = `polygon(0% 0%, ${tear.map(([x, y]) => `${x.toFixed(1)}% ${y.toFixed(1)}%`).join(",")}, 0% 100%)`;
      document.getElementById("rip-r").style.clipPath = `polygon(100% 0%, ${tear.map(([x, y]) => `${x.toFixed(1)}% ${y.toFixed(1)}%`).join(",")}, 100% 100%)`;
      // three word slams (paper strips slapped on at a tilt)
      ["#w1", "#w2", "#w3"].forEach((w, i) => {
        const t = 1.0 + i * 0.5;
        tl.fromTo(w, { opacity: 1, scale: 1.7, rotation: [-14, 12, -9][i] }, { scale: 1, rotation: [-4, 3, -2][i], duration: 0.09, ease: "power4.in" }, t);
        tl.to(w, { scale: 1.06, duration: i === 2 ? 0.5 : 0.4, ease: "none" }, t + 0.09);
        flash(t, 0.55); shake(t, 22); glowHit(t, 1);
      });
      // paper sheet drops over the riser, then rips apart on the big hit
      tl.fromTo("#rip-wrap", { yPercent: -100 }, { yPercent: 0, duration: 0.22, ease: "power3.in" }, 2.3);
      tl.fromTo("#rip-wrap", { scale: 1 }, { scale: 1.06, duration: 0.65, ease: "power1.in", immediateRender: false }, 2.33);
      tl.fromTo("#rip-l", { x: 0, rotation: 0 }, { x: -1250, rotation: -14, duration: 0.32, ease: "power2.out", immediateRender: false }, 2.97);
      tl.fromTo("#rip-r", { x: 0, rotation: 0 }, { x: 1250, rotation: 14, duration: 0.32, ease: "power2.out", immediateRender: false }, 2.97);
      tl.to("#rip-mark", { opacity: 0, duration: 0.08 }, 2.97);
      shake(2.3, 14, 4);
      // riser: glow tightens, darkness
      tl.to("#glow", { opacity: 0.1, duration: 0.6, ease: "power1.in" }, 2.3);
      // BIG HIT 3.0: logo slams in with shockwave
      tl.fromTo("#logo-wrap", { opacity: 0, scale: 2.4, rotation: -8 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.14, ease: "power4.in" }, 2.88);
      flash(3.05, 0.75, 0.3); shake(3.0, 40, 7); glowHit(3.0, 1.2);
      tl.fromTo("#glow-teal", { opacity: 0 }, { opacity: 0.8, duration: 0.3, ease: "power2.out" }, 3.0);
      tl.fromTo("#ring", { scale: 0.6, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.7, ease: "power2.out" }, 3.0);
      tl.fromTo("#ring2", { scale: 0.5, opacity: 0.9 }, { scale: 2.2, opacity: 0, duration: 0.8, ease: "power2.out" }, 3.05);
      tl.fromTo("#logo-wrap", { y: 0 }, { y: -10, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 3.4);
      // groove pulses on the beats
      [3.5, 4.0, 4.5, 5.0].forEach((b) => { glowHit(b, 0.75); tl.fromTo("#logo-wrap", { scale: 1.035 }, { scale: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, b); });
      // name: letters slam on the 16ths 3.5-4.0
      const nameEl = document.getElementById("name");
      const name = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables().name) || "JERIN J SEBASTIAN";
      nameEl.textContent = "";
      const letters = [];
      [...name].forEach((ch) => { const s = document.createElement("span"); if (ch === " ") s.className = "sp"; s.textContent = ch === " " ? "" : ch; nameEl.appendChild(s); if (ch !== " ") letters.push(s); });
      letters.forEach((s, i) => {
        const t = 3.5 + i * (0.5 / letters.length);
        tl.fromTo(s, { opacity: 0, scale: 2.2, y: -30 }, { opacity: 1, scale: 1, y: 0, duration: 0.07, ease: "power4.in" }, t);
      });
      shake(4.0, 8, 4);
      tl.fromTo("#handle", { opacity: 0, y: 30, scale: 1.4, rotation: -8 }, { opacity: 1, y: 0, scale: 1, rotation: -2, duration: 0.14, ease: "power4.in" }, 4.25);
      tl.fromTo("#tag", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 4.5);
      // final hit 5.5: flash, shine across the logo
      flash(5.5, 0.7, 0.3); shake(5.5, 26, 6); glowHit(5.5, 1.1);
      tl.fromTo("#shine-bar", { xPercent: 0 }, { xPercent: 420, duration: 0.6, ease: "power2.inOut" }, 5.45);
      tl.fromTo("#name", { scale: 1.08 }, { scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, 5.5);
      // embers (seeded): rise from the bottom after the riser starts
      let seed = 2026; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      const emb = document.getElementById("embers");
      for (let i = 0; i < 46; i++) {
        const e = document.createElement("div"); e.className = "ember"; emb.appendChild(e);
        const x = 60 + rnd() * 960, size = 4 + rnd() * 10, t = 2.4 + rnd() * 3.2, d = 1.4 + rnd() * 1.6;
        gsap.set(e, { left: x, top: 1500 + rnd() * 400, width: size, height: size });
        tl.fromTo(e, { opacity: 0, y: 0, x: 0 }, { opacity: 0.9, duration: 0.25, ease: "power1.out" }, t);
        tl.fromTo(e, { y: 0, x: 0 }, { y: -(700 + rnd() * 700), x: (rnd() - 0.5) * 160, duration: d, ease: "none", immediateRender: false }, t);
        tl.to(e, { opacity: 0, duration: 0.5, ease: "power1.in" }, t + d - 0.5);
      }
      // last frame holds the lockup; fade the glow down at the end
      tl.to(["#glow", "#glow-teal"], { opacity: 0.2, duration: 0.6, ease: "power1.in" }, 5.9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
