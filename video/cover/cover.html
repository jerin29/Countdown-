<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Reel cover</title>
<style>
  @font-face { font-family: "PF"; src: url("fonts/playfair-700i.woff2") format("woff2"); font-weight: 700; font-style: italic; }
  @font-face { font-family: "MS"; src: url("fonts/montserrat-900.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a0b12; }
  #photo {
    position: absolute; left: -180px; top: 0; width: 1440px; height: 1920px; object-fit: cover;
    filter: saturate(1.08) contrast(1.06) brightness(1.02) sepia(.12);
  }
  #shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(26,11,18,.86) 0%, rgba(26,11,18,.62) 16%, rgba(26,11,18,0) 30%),
      linear-gradient(0deg, rgba(26,11,18,.92) 0%, rgba(26,11,18,.55) 14%, rgba(26,11,18,0) 30%),
      radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(26,11,18,.35) 100%);
  }
  #leak {
    position: absolute; inset: 0; mix-blend-mode: screen; opacity: .55;
    background:
      radial-gradient(ellipse 45% 35% at 0% 40%, rgb(255 170 90 / 70%), transparent 70%),
      radial-gradient(ellipse 40% 30% at 100% 20%, rgb(255 80 90 / 45%), transparent 70%);
  }
  #top { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
  #pill {
    display: inline-block; font: 800 30px/1 "MS", sans-serif; letter-spacing: .22em; text-transform: uppercase;
    color: #1a0b12; background: #ff4d6d; padding: 14px 24px 12px 30px; border-radius: 999px;
  }
  #title {
    margin-top: 18px; font: italic 700 92px/1 "PF", serif; color: #fff6ec; letter-spacing: -0.01em;
    text-shadow: 0 6px 30px rgba(0,0,0,.55);
  }
  #stamp {
    position: absolute; left: 700px; top: 905px; width: 300px; padding: 22px 16px 18px; transform: rotate(-9deg);
    border: 6px solid #ff4d6d; border-radius: 18px; background: rgba(255,246,236,.94); text-align: center;
    color: #ff4d6d; font: 900 40px/1.02 "MS", sans-serif; text-transform: uppercase; letter-spacing: .04em;
    box-shadow: 0 16px 40px rgba(0,0,0,.4);
  }
  #stamp small { display: block; margin-top: 8px; font: italic 700 30px/1 "PF", serif; letter-spacing: 0; text-transform: none; color: #8a1f35; }
  #years {
    position: absolute; left: 70px; top: 1400px; transform: rotate(-4deg);
    font: 900 44px/1 "MS", sans-serif; color: #fff6ec; letter-spacing: .06em;
    background: #c4262c; padding: 16px 22px 14px; border-radius: 10px; box-shadow: 8px 10px 0 rgba(0,0,0,.3);
  }
  #years span { color: #ffd1a1; }
  #brand { position: absolute; left: 0; right: 0; top: 1530px; display: flex; align-items: center; justify-content: center; gap: 18px; }
  #brand img { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; background: #fbf5e6; border: 4px solid #fbf5e6; }
  #brand div { font: 800 40px/1 "MS", sans-serif; color: #fff6ec; text-shadow: 0 3px 14px rgba(0,0,0,.6); }
  .heart { position: absolute; width: 70px; height: 70px; }
  .heart path { fill: #ff4d6d; }
</style>
</head>
<body>
  <img id="photo" src="photo.jpg" alt="" />
  <div id="leak"></div>
  <div id="shade"></div>
  <div id="top">
    <div id="pill">Until I see you again</div>
    <div id="title">Counting down the years</div>
  </div>
  <div id="stamp">Sealed<br />with love<small>by hand, by post</small></div>
  <div id="years">2026 <span>→</span> 1960</div>
  <svg class="heart" viewBox="0 0 24 24" style="left:120px;top:960px;transform:rotate(-14deg)"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>
  <svg class="heart" viewBox="0 0 24 24" style="left:930px;top:1210px;width:48px;height:48px;transform:rotate(12deg)"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>
  <div id="brand"><img src="logo.png" alt="" /><div>@jerin_chronicles_</div></div>
</body>
</html>
