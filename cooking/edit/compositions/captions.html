<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    .cap { position: absolute; left: 0; right: 0; top: 290px; text-align: center; opacity: 0; filter: drop-shadow(0 12px 22px rgba(0,0,0,.55)); }
    .strip { display: inline-block; padding: 22px 46px 18px; background-color: #f1e3c4; background-image: url(assets/paper.png); background-size: 1080px 1920px; background-blend-mode: overlay; }
    .strip b { display: block; font: 400 104px/1 "League Gothic", "Oswald", sans-serif; letter-spacing: .03em; color: #1a0e0a; }
    .strip i { display: block; margin-top: 8px; font: 700 30px/1 "Montserrat", sans-serif; font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: #c4262c; }
    .stop .strip { background-color: #c4262c; } .stop .strip b { color: #fff3dc; } .stop .strip i { color: #ffd27a; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
    <div class="cap clip" id="cap-title" data-start="0.3" data-duration="6.7"><div class="strip"><b data-var-text="title">Wrap night on a budget</b><i data-var-text="subtitle">What it costs in Germany</i></div></div>
    <div class="cap stop clip" id="cap-s1" data-start="32.2" data-duration="4.5"><div class="strip"><b>Stop 1 · Wraps</b><i>the base</i></div></div>
    <div class="cap stop clip" id="cap-s2" data-start="65.2" data-duration="4.5"><div class="strip"><b>Stop 2 · Salad</b><i>the crunch</i></div></div>
    <div class="cap stop clip" id="cap-s3" data-start="82.2" data-duration="4.5"><div class="strip"><b>Stop 3 · Cold cuts</b><i>the filling</i></div></div>
    <div class="cap stop clip" id="cap-s4" data-start="116.5" data-duration="4.5"><div class="strip"><b>Stop 4 · Yogurt</b><i>the sauce</i></div></div>
  </div>
  <script>
    // torn edges (seeded) on every strip
    let sd = 31; const r = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
    document.querySelectorAll("#root .strip").forEach((el) => {
      const p = []; const n = 20;
      for (let i = 0; i <= n; i++) p.push(`${(i / n * 100).toFixed(1)}% ${(r() * 8).toFixed(1)}%`);
      for (let i = n; i >= 0; i--) p.push(`${(i / n * 100).toFixed(1)}% ${(92 + r() * 8).toFixed(1)}%`);
      el.style.clipPath = `polygon(${p.join(",")})`;
    });
    const tl = gsap.timeline({ paused: true });
    [["#cap-title", 0.3, 6.7, -3], ["#cap-s1", 32.2, 4.5, -4], ["#cap-s2", 65.2, 4.5, 3], ["#cap-s3", 82.2, 4.5, -3], ["#cap-s4", 116.5, 4.5, 4]].forEach(([el, t, d, rot]) => {
      tl.fromTo(el, { opacity: 0, scale: 1.6, rotation: rot * 3 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.14, ease: "power4.in" }, t);
      tl.fromTo(el, { y: 0 }, { y: -8, duration: d - 0.6, ease: "sine.inOut", immediateRender: false }, t + 0.2);
      tl.to(el, { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, t + d - 0.35);
    });
    window.__timelines["captions"] = tl;
  </script>
</template>
